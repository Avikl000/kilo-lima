media:
  input: content/media
  output: /media

content:
  - name: posts
    label: Posts
    type: collection
    path: content/posts
    filename: "{year}-{month}-{day}-{fields.title}.md"
    view:
      fields: [title, date, description]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: description
        label: Description
        type: string
      - name: cover
        label: Cover image
        type: image
      - name: body
        label: Body
        type: rich-text
      - name: cta
        label: Call to action
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: text
            label: Text
            type: text
          - name: buttonLabel
            label: Button label
            type: string
          - name: url
            label: Button link
            type: string

  - name: itineraries
    label: Itineraries
    type: collection
    path: content/itineraries
    filename: "{fields.title}.md"
    view:
      fields: [title, startDate, route, price]
      sort: [startDate, title]
      default:
        sort: startDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: subtitle
        label: Subtitle / tagline
        type: string
      - name: styleTag
        label: Style tag
        type: string
        description: "Small line above the hero title, e.g. 'By Private Jet'"
      - name: startDate
        label: Start date
        type: date
        required: true
        description: "Used for sorting only — not shown on the page"
      - name: dateLabel
        label: Dates (display text)
        type: string
        description: "e.g. 24 August – 6 September 2027"
      - name: departures
        label: Departures
        type: string
        list: true
        description: "Optional. If set, replaces Dates in the key-facts strip"
      - name: duration
        label: Duration
        type: string
        description: "e.g. 14 days"
      - name: route
        label: Route
        type: string
        description: "e.g. Cairo to Cape Town"
      - name: travelStyle
        label: Travel style
        type: string
        description: "e.g. Private jet, small group"
      - name: price
        label: Price
        type: string
        description: "e.g. From $114,950 per person"
      - name: maxGuests
        label: Max guests
        type: string
      - name: cover
        label: Hero image
        type: image
        description: "Full-bleed hero background"
      - name: coverCredit
        label: Hero image credit
        type: string
      - name: highlights
        label: At a glance
        type: string
        list: true
        description: "Short bullets shown under the overview"
      - name: experiences
        label: Highlights (image blocks)
        type: object
        list: true
        description: "Alternating image + text blocks"
        fields:
          - name: heading
            label: Heading
            type: string
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: description
            label: Description
            type: text
          - name: image
            label: Image
            type: image
          - name: imageAlt
            label: Image alt text
            type: string
            description: "Describes the image for screen readers. Defaults to the heading"
          - name: credit
            label: Image credit
            type: string
      - name: residences
        label: Residences
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: location
            label: Location
            type: string
          - name: description
            label: Description
            type: text
          - name: image
            label: Image
            type: image
          - name: imageAlt
            label: Image alt text
            type: string
          - name: credit
            label: Image credit
            type: string
      - name: routeMap
        label: Route map
        type: image
      - name: routeMapCredit
        label: Route map credit
        type: string
      - name: pdfUrl
        label: PDF link
        type: string
        description: "Shows a 'Save PDF' link beside the Itinerary heading"
      - name: days
        label: Day-by-day itinerary
        type: object
        list: true
        fields:
          - name: label
            label: Days
            type: string
            description: "e.g. Days 1–2"
          - name: location
            label: Location
            type: string
          - name: description
            label: Description
            type: text
          - name: image
            label: Photo
            type: image
          - name: imageAlt
            label: Photo alt text
            type: string
          - name: credit
            label: Photo credit
            type: string
      - name: inclusions
        label: Inclusions
        type: string
        list: true
      - name: testimonials
        label: Testimonials
        type: object
        list: true
        fields:
          - name: quote
            label: Quote
            type: text
          - name: attribution
            label: Attribution
            type: string
          - name: journey
            label: Journey / year
            type: string
      - name: body
        label: Overview
        type: rich-text
      - name: cta
        label: Call to action
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: text
            label: Text
            type: text
          - name: buttonLabel
            label: Button label
            type: string
          - name: url
            label: Button link
            type: string

  - name: homepage
    label: Homepage
    type: file
    path: content/index.njk
    fields:
      - name: title
        label: Title
        type: string
      - name: body
        label: Body
        type: code
