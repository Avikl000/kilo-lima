<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Sample schematic route map: Auckland to Fiordland, Sydney, the Whitsundays, Central Java, Ha Long Bay, Kyoto, and Tokyo">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <g stroke="rgba(49,78,103,0.06)" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="675"/><line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/><line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/><line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
    <line x1="0" y1="135" x2="1200" y2="135"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/><line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <text x="60" y="92" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" letter-spacing="2.4" fill="rgba(49,78,103,0.65)">SAMPLE ROUTE — THE PACIFIC RIM CIRCUIT</text>
  <text x="60" y="140" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="#314E67">Auckland to Tokyo</text>

  <path d="M1065,578 L966,620 L725,563 L692,490 L135,422 L90,269 L504,193 L560,190" fill="none" stroke="#314E67" stroke-width="2.5" stroke-dasharray="9 7" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <circle cx="1065" cy="578" r="6" fill="#314E67"/>
    <circle cx="966" cy="620" r="6" fill="#37AEE4"/>
    <circle cx="725" cy="563" r="6" fill="#37AEE4"/>
    <circle cx="692" cy="490" r="6" fill="#37AEE4"/>
    <circle cx="135" cy="422" r="6" fill="#37AEE4"/>
    <circle cx="90" cy="269" r="6" fill="#37AEE4"/>
    <circle cx="504" cy="193" r="6" fill="#37AEE4"/>
    <circle cx="560" cy="190" r="6" fill="#314E67"/>
  </g>

  <g font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="700" fill="#314E67">
    <text x="1140" y="544" text-anchor="end">Auckland</text>
    <text x="946" y="626" text-anchor="end">Fiordland</text>
    <text x="725" y="603" text-anchor="middle">Sydney</text>
    <text x="712" y="484">The Whitsundays</text>
    <text x="155" y="394">Central Java</text>
    <text x="120" y="300">Ha Long Bay</text>
    <text x="494" y="233" text-anchor="end">Kyoto</text>
    <text x="580" y="184">Tokyo</text>
  </g>
  <g font-family="Arial, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="rgba(49,78,103,0.65)">
    <text x="1140" y="566" text-anchor="end">START — DAYS 1–3</text>
    <text x="725" y="625" text-anchor="middle">DAYS 4–6</text>
    <text x="712" y="506">DAYS 7–9</text>
    <text x="155" y="416">DAYS 10–12</text>
    <text x="120" y="322">DAYS 13–15</text>
    <text x="580" y="206">DAYS 16–18 — END</text>
  </g>

  <text x="60" y="648" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="rgba(49,78,103,0.40)">SAMPLE — SCHEMATIC, NOT TO SCALE</text>
</svg>
