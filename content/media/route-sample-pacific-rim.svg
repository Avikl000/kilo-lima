<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Sample schematic route map: Auckland to Fiordland, Sydney, the Whitsundays, Central Java, Ha Long Bay, Kyoto, and Tokyo">
  <defs>
    <linearGradient id="route" gradientUnits="userSpaceOnUse" x1="1065" y1="620" x2="504" y2="190">
      <stop offset="0" stop-color="#9B30FF"/>
      <stop offset="0.5" stop-color="#5E6AFF"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0" stop-color="#9B30FF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#00D4FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0A0A0F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="#0A0A0F"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <g stroke="#9B30FF" stroke-opacity="0.06" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="675"/><line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/><line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/><line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
    <line x1="0" y1="135" x2="1200" y2="135"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/><line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <text x="60" y="96" font-family="'DM Mono',monospace" font-size="17" letter-spacing="4" fill="#00D4FF">SAMPLE ROUTE &#8212; THE PACIFIC RIM CIRCUIT</text>
  <text x="60" y="150" font-family="'Bebas Neue','Arial Narrow',sans-serif" font-size="54" letter-spacing="3" fill="#F0EEF8">AUCKLAND TO TOKYO</text>

  <path d="M1065,578 L966,620 L725,563 L692,490 L135,422 L90,269 L504,193 L560,190" fill="none" stroke="url(#route)" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <circle cx="1065" cy="578" r="14" fill="#9B30FF" opacity="0.18"/>
    <circle cx="1065" cy="578" r="6" fill="#9B30FF"/>
    <circle cx="966" cy="620" r="14" fill="#00D4FF" opacity="0.18"/>
    <circle cx="966" cy="620" r="6" fill="#00D4FF"/>
    <circle cx="725" cy="563" r="14" fill="#00D4FF" opacity="0.18"/>
    <circle cx="725" cy="563" r="6" fill="#00D4FF"/>
    <circle cx="692" cy="490" r="14" fill="#00D4FF" opacity="0.18"/>
    <circle cx="692" cy="490" r="6" fill="#00D4FF"/>
    <circle cx="135" cy="422" r="14" fill="#00D4FF" opacity="0.18"/>
    <circle cx="135" cy="422" r="6" fill="#00D4FF"/>
    <circle cx="90" cy="269" r="14" fill="#00D4FF" opacity="0.18"/>
    <circle cx="90" cy="269" r="6" fill="#00D4FF"/>
    <circle cx="504" cy="193" r="14" fill="#00D4FF" opacity="0.18"/>
    <circle cx="504" cy="193" r="6" fill="#00D4FF"/>
    <circle cx="560" cy="190" r="14" fill="#CC00FF" opacity="0.18"/>
    <circle cx="560" cy="190" r="6" fill="#CC00FF"/>
  </g>

  <g font-family="'Space Grotesk',sans-serif" font-size="21" font-weight="600" fill="#F0EEF8">
    <text x="1140" y="544" text-anchor="end">Auckland</text>
    <text x="946" y="626" text-anchor="end">Fiordland</text>
    <text x="725" y="603" text-anchor="middle">Sydney</text>
    <text x="712" y="484">The Whitsundays</text>
    <text x="155" y="394">Central Java</text>
    <text x="120" y="300">Ha Long Bay</text>
    <text x="494" y="233" text-anchor="end">Kyoto</text>
    <text x="580" y="184">Tokyo</text>
  </g>
  <g font-family="'DM Mono',monospace" font-size="14" letter-spacing="2.5" fill="rgba(240,238,248,0.55)">
    <text x="1140" y="566" text-anchor="end">START &#8212; DAYS 1&#8211;3</text>
    <text x="725" y="625" text-anchor="middle">DAYS 4&#8211;6</text>
    <text x="712" y="506">DAYS 7&#8211;9</text>
    <text x="155" y="372">DAYS 10&#8211;12</text>
    <text x="120" y="322">DAYS 13&#8211;15</text>
    <text x="580" y="206">DAYS 16&#8211;18 &#8212; END</text>
  </g>

  <text x="60" y="648" font-family="'DM Mono',monospace" font-size="14" letter-spacing="2.5" fill="rgba(240,238,248,0.38)">SAMPLE &#8212; SCHEMATIC, NOT TO SCALE</text>
</svg>
