<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Schematic route map: Windhoek to Sossusvlei, Okavango Delta, Victoria Falls, and Cape Town">
  <defs>
    <linearGradient id="route" gradientUnits="userSpaceOnUse" x1="193" y1="620" x2="943" y2="190">
      <stop offset="0" stop-color="#9B30FF"/>
      <stop offset="0.5" stop-color="#5E6AFF"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.55" r="0.75">
      <stop offset="0" stop-color="#9B30FF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#00D4FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0A0A0F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="#0A0A0F"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <g stroke="#9B30FF" stroke-opacity="0.06" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="675"/><line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/><line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/><line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
    <line x1="0" y1="135" x2="1200" y2="135"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/><line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <text x="60" y="96" font-family="'DM Mono',monospace" font-size="17" letter-spacing="4" fill="#00D4FF">ROUTE &#8212; THE SOUTHERN CROSSING</text>
  <text x="60" y="150" font-family="'Bebas Neue','Arial Narrow',sans-serif" font-size="54" letter-spacing="3" fill="#F0EEF8">WINDHOEK TO CAPE TOWN</text>

  <path d="M321,317 L193,368 L700,228 L943,190 L414,620" fill="none" stroke="url(#route)" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <circle cx="321" cy="317" r="14" fill="#9B30FF" opacity="0.18"/>
    <circle cx="321" cy="317" r="6" fill="#9B30FF"/>
    <circle cx="193" cy="368" r="14" fill="#00D4FF" opacity="0.18"/>
    <circle cx="193" cy="368" r="6" fill="#00D4FF"/>
    <circle cx="700" cy="228" r="14" fill="#00D4FF" opacity="0.18"/>
    <circle cx="700" cy="228" r="6" fill="#00D4FF"/>
    <circle cx="943" cy="190" r="14" fill="#00D4FF" opacity="0.18"/>
    <circle cx="943" cy="190" r="6" fill="#00D4FF"/>
    <circle cx="414" cy="620" r="14" fill="#CC00FF" opacity="0.18"/>
    <circle cx="414" cy="620" r="6" fill="#CC00FF"/>
  </g>

  <g font-family="'Space Grotesk',sans-serif" font-size="21" font-weight="600" fill="#F0EEF8">
    <text x="321" y="283" text-anchor="middle">Windhoek</text>
    <text x="150" y="408">Sossusvlei</text>
    <text x="700" y="188" text-anchor="middle">Okavango Delta</text>
    <text x="963" y="184">Victoria Falls</text>
    <text x="394" y="614" text-anchor="end">Cape Town</text>
  </g>
  <g font-family="'DM Mono',monospace" font-size="14" letter-spacing="2.5" fill="rgba(240,238,248,0.55)">
    <text x="321" y="305" text-anchor="middle">START</text>
    <text x="150" y="430">DAYS 1&#8211;3</text>
    <text x="700" y="210" text-anchor="middle">DAYS 4&#8211;6</text>
    <text x="963" y="206">DAYS 7&#8211;8</text>
    <text x="394" y="636" text-anchor="end">DAYS 9&#8211;12 &#8212; END</text>
  </g>

  <text x="1140" y="640" text-anchor="end" font-family="'DM Mono',monospace" font-size="14" letter-spacing="2.5" fill="rgba(240,238,248,0.38)">SCHEMATIC &#8212; NOT TO SCALE</text>
</svg>
