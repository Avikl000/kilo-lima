<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Schematic route map: Windhoek to Sossusvlei, Okavango Delta, Victoria Falls, and Cape Town">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <g stroke="rgba(49,78,103,0.06)" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="675"/><line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/><line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/><line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
    <line x1="0" y1="135" x2="1200" y2="135"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/><line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <text x="60" y="92" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" letter-spacing="2.4" fill="rgba(49,78,103,0.65)">ROUTE — THE SOUTHERN CROSSING</text>
  <text x="60" y="140" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="#314E67">Windhoek to Cape Town</text>

  <path d="M321,317 L193,368 L700,228 L943,190 L414,620" fill="none" stroke="#314E67" stroke-width="2.5" stroke-dasharray="9 7" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <circle cx="321" cy="317" r="6" fill="#314E67"/>
    <circle cx="193" cy="368" r="6" fill="#37AEE4"/>
    <circle cx="700" cy="228" r="6" fill="#37AEE4"/>
    <circle cx="943" cy="190" r="6" fill="#37AEE4"/>
    <circle cx="414" cy="620" r="6" fill="#314E67"/>
  </g>

  <g font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="700" fill="#314E67">
    <text x="321" y="283" text-anchor="middle">Windhoek</text>
    <text x="150" y="408">Sossusvlei</text>
    <text x="700" y="188" text-anchor="middle">Okavango Delta</text>
    <text x="963" y="184">Victoria Falls</text>
    <text x="394" y="614" text-anchor="end">Cape Town</text>
  </g>
  <g font-family="Arial, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="rgba(49,78,103,0.65)">
    <text x="321" y="303" text-anchor="middle">START</text>
    <text x="150" y="430">DAYS 1–3</text>
    <text x="700" y="208" text-anchor="middle">DAYS 4–6</text>
    <text x="963" y="204">DAYS 7–8</text>
    <text x="394" y="636" text-anchor="end">DAYS 9–12 — END</text>
  </g>

  <text x="1140" y="640" text-anchor="end" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="rgba(49,78,103,0.40)">SCHEMATIC — NOT TO SCALE</text>
</svg>
